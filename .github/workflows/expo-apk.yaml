name: Expo APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install EAS
        run: npm install -g eas-cli

      - name: Install frontend dependencies
        working-directory: project-frontend
        run: npm install

      - name: Build APK (Expo)
        working-directory: project-frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive


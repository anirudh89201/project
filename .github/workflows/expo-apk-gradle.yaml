name: Expo APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your code
      - uses: actions/checkout@v4

      # Step 2: Setup Node.js (needed if you run Expo commands)
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # Step 3: Install frontend dependencies (if needed for prebuild)
      - name: Install frontend dependencies
        working-directory: frontend/project-frontend
        run: npm install

      # Step 4: Prebuild Android project
      - name: Prebuild Android project
        working-directory: frontend/project-frontend
        run: npx expo prebuild -p android

      # Step 5: Build APK using Gradle
      - name: Build Debug APK
        working-directory: frontend/project-frontend/android
        run: ./gradlew assembleDebug

      # Step 6: Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: frontend/project-frontend/android/app/build/outputs/apk/debug/app-debug.apk
